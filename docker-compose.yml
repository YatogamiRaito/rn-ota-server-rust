services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ota_server
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: .
    env_file:
      - .env
    environment:
      # Override the host part of DATABASE_URL so it points at the mysql service.
      DATABASE_URL: mysql://root:password@mysql:3306/ota_server
      HOST: 0.0.0.0
      PORT: 3010
    ports:
      - '3010:3010'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
